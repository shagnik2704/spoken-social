# Promtail: the agent that tails log files and pushes them to Loki.
#
# NOTE: Promtail is superseded by Grafana Alloy. We use it here because its config
# is far easier to read while you're learning the concepts — and every concept below
# (positions, clients, labels, __path__) maps 1:1 onto Alloy. We'll switch to Alloy
# when we deploy to Hetzner in Phase 5.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

# Remembers how far it has read into each file, so a restart doesn't re-send everything.
positions:
  filename: /tmp/positions.yaml

# Where to push the logs.
clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: spoken-social-backend
    static_configs:
      - targets: [localhost]
        labels:
          # These become the LOKI STREAM LABELS you select with {job="..."}.
          # Keep them few and low-cardinality — never put user/request IDs here.
          job: spoken-social-backend
          service: backend
          # The file(s) to tail, inside the container (we mount ./logs here).
          __path__: /logs/*.log
