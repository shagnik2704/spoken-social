name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend CI: Dependencies, Compilation, Alembic Migrations & Pytest
  # ============================================================================
  backend-ci:
    name: Backend (FastAPI, Alembic & Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spoken_social
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python syntax and bytecode compilation
        run: |
          python -m compileall backend

      - name: Verify Alembic database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spoken_social
          PYTHONPATH: .
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest test suite
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spoken_social_test
          PYTHONPATH: .
        run: |
          cd backend
          pytest -v --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore

  # ============================================================================
  # 2. Frontend CI: Linting, Typecheck & Vite Production Build
  # ============================================================================
  frontend-ci:
    name: Frontend (Vite, React & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript typecheck & production build
        run: |
          cd frontend
          npm run build

      - name: Verify build artifacts
        run: |
          test -f frontend/dist/index.html
          echo "Frontend build successfully generated dist/index.html"

  # ============================================================================
  # 3. Docker CI: Compose validation & Image Build Verification
  # ============================================================================
  docker-ci:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate docker-compose configuration
        run: |
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MCP Observability Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-observability
          file: ./mcp-observability/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4. Gating Check: Aggregates all CI jobs for Branch Protection Rules
  # ============================================================================
  ci-status:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-ci]
    if: always()
    steps:
      - name: Evaluate CI jobs status
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ]; then
            echo "::error::backend-ci job failed or was cancelled (${{ needs.backend-ci.result }})"
            exit 1
          fi
          if [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "::error::frontend-ci job failed or was cancelled (${{ needs.frontend-ci.result }})"
            exit 1
          fi
          if [ "${{ needs.docker-ci.result }}" != "success" ]; then
            echo "::error::docker-ci job failed or was cancelled (${{ needs.docker-ci.result }})"
            exit 1
          fi
          echo "All checks (backend, frontend, docker) passed successfully!"

      - name: Add CI summary to Step Summary
        run: |
          echo "### 🚀 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Alembic + Pytest) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Lint + Vite Build) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker (Compose + 3 Images) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
