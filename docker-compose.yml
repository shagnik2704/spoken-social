services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379
      DEV_BYPASS_ENABLED: ${DEV_BYPASS_ENABLED:-false}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build: ./backend
    command: arq worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      TZ: Asia/Kolkata
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # gateway:
  #   build: ./gateway
  #   environment:
  #     SECRET_KEY: ${SECRET_KEY}
  #   ports:
  #     - "8000:80"
  #   depends_on:
  #     - backend
  #     - redis
  #   restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # TLS terminates at host nginx; the container's nginx listens on :80 only.
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ss-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROM_HOST_PORT:-9090}:9090"
    restart: unless-stopped

  # Host metrics: CPU / memory / disk / network of the machine.
  # NOTE on macOS: Docker runs inside a Linux VM, so these describe that VM, not your
  # Mac. Fine for learning PromQL — on the Hetzner VPS these become genuinely useful.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ss-node-exporter
    restart: unless-stopped

  # Per-container metrics (CPU/mem/net per running container).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ss-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    restart: unless-stopped

  # Log aggregation. Indexes LABELS only; log text is stored compressed and grepped.
  loki:
    image: grafana/loki:latest
    container_name: ss-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: ss-promtail
    command: 
      - config.file=/etc/promtail/promtail-config.yml 
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./observability/logs:/logs:ro
    depends_on:
      - loki
    restart: unless-stopped

  mcp-server:
    build: ./mcp-observability
    container_name: ss-mcp-server
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=8080
      - MCP_HOST=0.0.0.0
      - PROMETHEUS_URL=http://prometheus:9090 
      - LOKI_URL=http://loki:3100
      - MCP_DATABASE_URL=${MCP_DATABASE_URL}
    depends_on:
      - prometheus
      - loki
      - postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8080}:8080"


volumes:
  postgres_data:
  prometheus_data:
  loki_data:
