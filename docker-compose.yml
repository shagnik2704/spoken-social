services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379
      DEV_BYPASS_ENABLED: ${DEV_BYPASS_ENABLED:-false}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build: ./backend
    command: arq worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      TZ: Asia/Kolkata
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # gateway:
  #   build: ./gateway
  #   environment:
  #     SECRET_KEY: ${SECRET_KEY}
  #   ports:
  #     - "8000:80"
  #   depends_on:
  #     - backend
  #     - redis
  #   restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # TLS terminates at host nginx; the container's nginx listens on :80 only.
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ss-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROM_HOST_PORT:-9090}:9090"
    restart: unless-stopped

  # Host metrics: CPU / memory / disk / network of the machine.
  # NOTE on macOS: Docker runs inside a Linux VM, so these describe that VM, not your
  # Mac. Fine for learning PromQL — on the Hetzner VPS these become genuinely useful.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ss-node-exporter
    command:
      # Defaults enable ~40 collectors and produced 2,730 series. This keeps the
      # four that answer "is the host healthy" and drops per-CPU, per-IRQ,
      # netlink and hardware families that nothing here queries.
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.netdev
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)
    restart: unless-stopped

  # Per-container metrics (CPU/mem/net per running container).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ss-cadvisor
    command:
      # cadvisor was 9,184 of ~13,800 series and two thirds of all samples
      # ingested — more than everything else combined, for a box idling at
      # under 1% CPU. These flags keep per-container CPU/memory/network and
      # drop the families nobody here reads.
      - --docker_only=true                       # skip system cgroups
      - --store_container_labels=false           # labels became series dimensions
      - --disable_metrics=percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl,tcp,udp,advtcp,memory_numa
      - --housekeeping_interval=30s              # was 1s; scraped every 60s anyway
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    restart: unless-stopped

  # Log aggregation. Indexes LABELS only; log text is stored compressed and grepped.
  loki:
    image: grafana/loki:latest
    container_name: ss-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    restart: unless-stopped

  # Log collection: reads every container's stdout/stderr via the Docker API and
  # ships it to Loki. Replaces promtail (deprecated). See observability/alloy/config.alloy.
  alloy:
    image: grafana/alloy:v1.5.1   # PINNED — verify the current v1.x stable on Docker Hub before deploy
    container_name: ss-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only Docker socket: how Alloy discovers containers and reads their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    # If Alloy logs "permission denied" on the socket, uncomment (its user must be
    # able to read /var/run/docker.sock, which is root:docker on the host).
    # user: root
    # Alloy's debug UI (component graph, live target health) is on :12345. Not
    # published by default to avoid a prod port collision — expose to loopback if
    # you want it: ports: ["127.0.0.1:${ALLOY_HOST_PORT:-12345}:12345"]
    depends_on:
      - loki
    restart: unless-stopped

  mcp-server:
    build: ./mcp-observability
    container_name: ss-mcp-server
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=8080
      - MCP_HOST=0.0.0.0
      - PROMETHEUS_URL=http://prometheus:9090 
      - LOKI_URL=http://loki:3100
      - MCP_DATABASE_URL=${MCP_DATABASE_URL}
    depends_on:
      - prometheus
      - loki
      - postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8080}:8080"


volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  alloy_data:
