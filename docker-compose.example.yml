services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spoken_social
      POSTGRES_USER: spoken_user
      POSTGRES_PASSWORD: supersecretpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "EG_PORT:5432"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://spoken_user:supersecretpassword@postgres:5432/spoken_social
      SECRET_KEY: spoken-social-dev-secret-key-change-me-later
    ports:
      - "EG_PORT:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  
  frontend:
    build: ./frontend
    ports:
      - "EG_PORT:80"
    restart: unless-stopped

volumes:
  postgres_data: