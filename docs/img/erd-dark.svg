<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" font-family="Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3949ab"/><stop offset="1" stop-color="#0f766e"/>
  </linearGradient>
  <marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b99b5"/>
  </marker>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.14"/>
  </filter>
</defs>
<style>
  .bg{fill:#0b1120}.card{fill:#111a2e;stroke:#253352;stroke-width:1.5}
  .cardA{fill:#161e42;stroke:#8c9eff;stroke-width:2}
  .cardB{fill:#0c2a28;stroke:#2dd4bf;stroke-width:2}
  .cardC{fill:#2a2008;stroke:#fbbf24;stroke-width:2}
  .cardD{fill:#2d1414;stroke:#f87171;stroke-width:2}
  .cardE{fill:#221641;stroke:#a78bfa;stroke-width:2;stroke-dasharray:6 3}
  .cardG{fill:#0f2a18;stroke:#4ade80;stroke-width:2}
  .inner{fill:#0b1120;stroke:#3b4a7a;stroke-width:1.2}
  .band{fill:#0e1526;stroke:#2b3a5c;stroke-width:1.5}
  .t1{fill:#e6ecf7;font-weight:700}.t2{fill:#c3cee3;font-weight:600}
  .lbl{fill:#a8b6d0}.mut{fill:#7c8aa5}
  .tA{fill:#8c9eff;font-weight:700}.tB{fill:#2dd4bf;font-weight:700}
  .tC{fill:#fbbf24;font-weight:700}.tD{fill:#f87171;font-weight:700}
  .tE{fill:#a78bfa;font-weight:700}.tG{fill:#4ade80;font-weight:700}
  .arr{stroke:#8b99b5;stroke-width:2;fill:none}
  .arrA{stroke:#8c9eff;stroke-width:2.2;fill:none}
  .arrB{stroke:#2dd4bf;stroke-width:2;fill:none}
  .arrD{stroke:#f87171;stroke-width:2;fill:none}
  .arrE{stroke:#a78bfa;stroke-width:2;stroke-dasharray:6 3;fill:none}
  .arrG{stroke:#4ade80;stroke-width:2;fill:none}
  .pill{fill:#111a2e;stroke:#3b4a7a;stroke-width:1}
  .pilltext{fill:#a8b6d0;font-weight:600}
  .accent{fill:url(#brand)}
  .num{fill:#0b1120;font-weight:700}
  .numbg{fill:#8c9eff}
  .gold{fill:#fbbf24;font-weight:700}
</style>
<rect class="bg" width="1440" height="810"/>

<rect class="accent" x="40" y="34" width="56" height="8" rx="4"/>
<text x="40" y="74" font-size="26" class="t1">Spoken Social — Core Schema</text>
<text x="40" y="98" font-size="13.5" class="mut">27 tables · arrows point from foreign key to referenced table · social-feed schema grouped (disabled)</text>
<!-- content hierarchy (left) -->
<g filter="url(#sh)"><rect class="cardE" x="60" y="140" width="230" height="72" rx="12"/></g>
<text x="175" y="168" font-size="14" text-anchor="middle" class="tE">programmes</text>
<text x="175" y="190" font-size="11" text-anchor="middle" class="mut">id PK · name</text>

<g filter="url(#sh)"><rect class="cardE" x="60" y="288" width="230" height="80" rx="12"/></g>
<text x="175" y="316" font-size="14" text-anchor="middle" class="tE">courses</text>
<text x="175" y="336" font-size="11" text-anchor="middle" class="mut">id PK · name · total_tutorials</text>

<g filter="url(#sh)"><rect class="cardE" x="60" y="444" width="230" height="80" rx="12"/></g>
<text x="175" y="472" font-size="14" text-anchor="middle" class="tE">batches</text>
<text x="175" y="492" font-size="11" text-anchor="middle" class="mut">course_id FK · start/end · status</text>
<text x="175" y="508" font-size="11" text-anchor="middle" class="mut">archived ⇒ read-only enrolments</text>

<g filter="url(#sh)"><rect class="cardE" x="60" y="600" width="230" height="72" rx="12"/></g>
<text x="175" y="628" font-size="14" text-anchor="middle" class="tE">tutorials</text>
<text x="175" y="650" font-size="11" text-anchor="middle" class="mut">course_id FK · title · order</text>

<rect class="card" x="332" y="150" width="196" height="56" rx="10"/>
<text x="430" y="172" font-size="12" text-anchor="middle" class="t2">programme_courses</text>
<text x="430" y="192" font-size="10.5" text-anchor="middle" class="mut">programme_id · course_id</text>

<!-- junctions (middle-left) -->
<g filter="url(#sh)"><rect class="cardA" x="332" y="300" width="196" height="80" rx="12"/></g>
<text x="430" y="326" font-size="13" text-anchor="middle" class="tA">user_courses</text>
<text x="430" y="346" font-size="10.5" text-anchor="middle" class="mut">user · course · batch</text>
<text x="430" y="364" font-size="10.5" text-anchor="middle" class="mut">(enrolment)</text>

<g filter="url(#sh)"><rect class="cardA" x="332" y="470" width="196" height="104" rx="12"/></g>
<text x="430" y="496" font-size="13" text-anchor="middle" class="tA">user_tutorials</text>
<text x="430" y="516" font-size="10.5" text-anchor="middle" class="mut">user_id · tutorial_id</text>
<text x="430" y="533" font-size="10.5" text-anchor="middle" class="mut">watched · practiced · assignment</text>
<text x="430" y="552" font-size="10.5" text-anchor="middle" class="mut">xp_earned — derived, covering-indexed</text>

<!-- users (center) -->
<g filter="url(#sh)"><rect class="cardC" x="620" y="330" width="260" height="150" rx="14"/></g>
<text x="750" y="360" font-size="16" text-anchor="middle" class="tC">users</text>
<text x="750" y="384" font-size="11.5" text-anchor="middle" class="lbl">id PK · email · role</text>
<text x="750" y="402" font-size="11.5" text-anchor="middle" class="lbl">xp_total · level · college_id FK</text>
<text x="750" y="420" font-size="11.5" text-anchor="middle" class="lbl">is_test_account NOT NULL</text>
<text x="750" y="444" font-size="11" text-anchor="middle" class="mut">student · coordinator · admin</text>

<!-- right column -->
<g filter="url(#sh)"><rect class="cardB" x="1010" y="140" width="380" height="76" rx="12"/></g>
<text x="1200" y="168" font-size="14" text-anchor="middle" class="tB">colleges</text>
<text x="1200" y="190" font-size="11" text-anchor="middle" class="mut">id PK · name · location · coordinator linkage</text>

<g filter="url(#sh)"><rect class="cardC" x="1010" y="256" width="380" height="92" rx="12"/></g>
<text x="1200" y="284" font-size="14" text-anchor="middle" class="tC">xp_events — append-only journal</text>
<text x="1200" y="306" font-size="11" text-anchor="middle" class="mut">user_id FK · xp_delta · source_type · course_id</text>
<text x="1200" y="324" font-size="11" text-anchor="middle" class="mut">created_at indexed · powers windowed boards</text>

<g filter="url(#sh)"><rect class="cardD" x="1010" y="388" width="380" height="88 " rx="12"/></g>
<text x="1200" y="416" font-size="14" text-anchor="middle" class="tD">forum_activities</text>
<text x="1200" y="438" font-size="11" text-anchor="middle" class="mut">user · tutorial · type · posted_at</text>
<text x="1200" y="456" font-size="11" text-anchor="middle" class="mut">deleted_on_forum · xp_awarded — the 24 h state</text>

<g filter="url(#sh)"><rect class="card" x="1010" y="516" width="380" height="72" rx="12"/></g>
<text x="1200" y="544" font-size="13" text-anchor="middle" class="t2">tutorial_feedback</text>
<text x="1200" y="566" font-size="11" text-anchor="middle" class="mut">user · tutorial · reason — “No” answers explained</text>

<g filter="url(#sh)"><rect class="card" x="1010" y="628" width="380" height="88" rx="12"/></g>
<text x="1200" y="656" font-size="13" text-anchor="middle" class="t2">activity · impersonation_logs</text>
<text x="1200" y="678" font-size="11" text-anchor="middle" class="mut">logins + failures (IP, reason JSONB)</text>
<text x="1200" y="696" font-size="11" text-anchor="middle" class="mut">impersonation sessions, start → end</text>

<!-- social cluster -->
<g filter="url(#sh)"><rect class="cardD" x="620" y="620" width="330" height="150" rx="14" stroke-dasharray="7 4"/></g>
<text x="785" y="650" font-size="13" text-anchor="middle" class="tD">social-feed schema (disabled in UI)</text>
<text x="785" y="676" font-size="11.5" text-anchor="middle" class="lbl">posts · post_likes · post_comments · post_shares</text>
<text x="785" y="696" font-size="11.5" text-anchor="middle" class="lbl">follows · hashtags · post_hashtags · tags</text>
<text x="785" y="722" font-size="11" text-anchor="middle" class="mut">all reference users(id) · polymorphic interactions</text>

