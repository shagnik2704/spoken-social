<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" font-family="Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3949ab"/><stop offset="1" stop-color="#0f766e"/>
  </linearGradient>
  <marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
  </marker>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.14"/>
  </filter>
</defs>
<style>
  .bg{fill:#f8fafc}.card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
  .cardA{fill:#eef2ff;stroke:#283593;stroke-width:2}
  .cardB{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}
  .cardC{fill:#fffbeb;stroke:#b45309;stroke-width:2}
  .cardD{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}
  .cardE{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:6 3}
  .cardG{fill:#f0fdf4;stroke:#15803d;stroke-width:2}
  .inner{fill:#ffffff;stroke:#c7d2fe;stroke-width:1.2}
  .band{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.5}
  .t1{fill:#0f172a;font-weight:700}.t2{fill:#334155;font-weight:600}
  .lbl{fill:#475569}.mut{fill:#64748b}
  .tA{fill:#283593;font-weight:700}.tB{fill:#0f766e;font-weight:700}
  .tC{fill:#92400e;font-weight:700}.tD{fill:#b91c1c;font-weight:700}
  .tE{fill:#6d28d9;font-weight:700}.tG{fill:#15803d;font-weight:700}
  .arr{stroke:#475569;stroke-width:2;fill:none}
  .arrA{stroke:#283593;stroke-width:2.2;fill:none}
  .arrB{stroke:#0f766e;stroke-width:2;fill:none}
  .arrD{stroke:#b91c1c;stroke-width:2;fill:none}
  .arrE{stroke:#6d28d9;stroke-width:2;stroke-dasharray:6 3;fill:none}
  .arrG{stroke:#15803d;stroke-width:2;fill:none}
  .pill{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
  .pilltext{fill:#475569;font-weight:600}
  .accent{fill:url(#brand)}
  .num{fill:#ffffff;font-weight:700}
  .numbg{fill:#283593}
  .gold{fill:#b45309;font-weight:700}
</style>
<rect class="bg" width="1440" height="830"/>

<rect class="accent" x="40" y="34" width="56" height="8" rx="4"/>
<text x="40" y="74" font-size="26" class="t1">The XP Integrity Triangle</text>
<text x="40" y="98" font-size="13.5" class="mut">one writer · one journal · one checker generated from the same rules</text>
<!-- Step 1: student write -->
<circle class="numbg" cx="84" cy="176" r="15"/><text x="84" y="181" font-size="13" text-anchor="middle" class="num">1</text>
<text x="112" y="181" font-size="15" class="t2">A student answers a tutorial step — the UI updates instantly, then the backend recomputes</text>

<g filter="url(#sh)"><rect class="cardA" x="60" y="210" width="320" height="104" rx="14"/></g>
<text x="220" y="240" font-size="14.5" text-anchor="middle" class="tA">PUT /tutorials/&#123;id&#125;</text>
<text x="220" y="262" font-size="12" text-anchor="middle" class="lbl">watched · practiced · assignment · minitask</text>
<text x="220" y="284" font-size="11.5" text-anchor="middle" class="mut">optimistic UI mirrors the same XP map</text>

<g filter="url(#sh)"><rect class="cardA" x="480" y="196" width="400" height="132" rx="14"/></g>
<text x="680" y="226" font-size="15" text-anchor="middle" class="tA">recompute_tutorial_xp(row)</text>
<text x="680" y="250" font-size="12.5" text-anchor="middle" class="lbl">xp_earned = Σ XP_MAP over TRUE flags — never incremented</text>
<text x="680" y="270" font-size="12.5" text-anchor="middle" class="lbl">returns a delta · idempotent: same flags → 0</text>
<text x="680" y="294" font-size="11.5" text-anchor="middle" class="mut">the ONLY code path that writes XP — every writer calls it</text>

<g filter="url(#sh)"><rect class="cardC" x="1010" y="196" width="380" height="132" rx="14"/></g>
<text x="1200" y="226" font-size="15" text-anchor="middle" class="tC">xp_events (append-only)</text>
<text x="1200" y="250" font-size="12.5" text-anchor="middle" class="lbl">user · Δxp · source_type · course · timestamp</text>
<text x="1200" y="270" font-size="12.5" text-anchor="middle" class="lbl">feeds weekly/monthly boards + history charts</text>
<text x="1200" y="294" font-size="11.5" text-anchor="middle" class="mut">reconciliation events excluded from windows</text>

<path class="arrA" d="M 380 262 L 476 262" marker-end="url(#m)"/>
<path class="arrA" d="M 880 262 L 1006 262" marker-end="url(#m)"/>
<rect class="pill" x="896" y="240" width="96" height="22" rx="11"/><text x="944" y="255" font-size="10.5" text-anchor="middle" class="pilltext">journal entry</text>

<!-- Step 2: forum path -->
<circle class="numbg" cx="84" cy="392" r="15"/><text x="84" y="397" font-size="13" text-anchor="middle" class="num">2</text>
<text x="112" y="397" font-size="15" class="t2">Forum XP is promised immediately but paid only after surviving 24 hours — farming earns nothing</text>

<g filter="url(#sh)"><rect class="cardE" x="60" y="426" width="320" height="104" rx="14"/></g>
<text x="220" y="456" font-size="14.5" text-anchor="middle" class="tE">Forum webhook</text>
<text x="220" y="478" font-size="12" text-anchor="middle" class="lbl">question / answer posted (or deleted)</text>
<text x="220" y="500" font-size="11.5" text-anchor="middle" class="mut">shared-secret verified · idempotent per post ID</text>

<g filter="url(#sh)"><rect class="card" x="480" y="426" width="400" height="104" rx="14"/></g>
<text x="680" y="456" font-size="14.5" text-anchor="middle" class="t2">Dashboard radio flips — XP does NOT move</text>
<text x="680" y="478" font-size="12" text-anchor="middle" class="lbl">activity recorded with posted_at · deleted · xp_awarded</text>
<text x="680" y="500" font-size="11.5" text-anchor="middle" class="mut">flag and xp_earned legitimately disagree during the window</text>

<g filter="url(#sh)"><rect class="cardG" x="1010" y="426" width="380" height="104" rx="14"/></g>
<text x="1200" y="456" font-size="14.5" text-anchor="middle" class="tG">arq sweep — every 15 min</text>
<text x="1200" y="478" font-size="12" text-anchor="middle" class="lbl">pays posts ≥ 24 h old, never deleted</text>
<text x="1200" y="500" font-size="11.5" text-anchor="middle" class="mut">needs the ABSENCE of a delete → fails safe</text>

<path class="arrE" d="M 380 478 L 476 478" marker-end="url(#m)"/>
<path class="arrG" d="M 880 478 L 1006 478" marker-end="url(#m)"/>
<path class="arrG" d="M 1200 426 C 1200 380 1000 340 884 300" marker-end="url(#m)"/>
<rect class="pill" x="1046" y="360" width="150" height="22" rx="11"/><text x="1121" y="375" font-size="10.5" text-anchor="middle" class="pilltext">same recompute function</text>

<!-- Step 3: invariants -->
<circle class="numbg" cx="84" cy="608" r="15"/><text x="84" y="613" font-size="13" text-anchor="middle" class="num">3</text>
<text x="112" y="613" font-size="15" class="t2">Every night, seven invariants generated from the SAME rules verify the books — a healthy system reports all zeros</text>

<g filter="url(#sh)"><rect class="cardG" x="60" y="642" width="560 " height="150" rx="14"/></g>
<text x="340" y="672" font-size="14.5" text-anchor="middle" class="tG">Nightly integrity check — 02:00 IST</text>
<text x="340" y="696" font-size="12" text-anchor="middle" class="lbl">rows match flags · totals match row sums · signed drift · levels</text>
<text x="340" y="714" font-size="12" text-anchor="middle" class="lbl">impossible totals · impossible rows · NULL test flags</text>
<text x="340" y="738" font-size="11.5" text-anchor="middle" class="mut">SQL built from XP_MAP + level thresholds — rule changes can never</text>
<text x="340" y="754" font-size="11.5" text-anchor="middle" class="mut">leave the checker asserting stale rules · pending forum XP exempted only inside its window</text>

<g filter="url(#sh)"><rect class="cardC" x="700" y="642" width="330" height="150" rx="14"/></g>
<text x="865" y="672" font-size="14.5" text-anchor="middle" class="tC">xp_integrity_* gauges</text>
<text x="865" y="696" font-size="12" text-anchor="middle" class="lbl">7 counters + healthy + age_seconds</text>
<text x="865" y="716" font-size="12" text-anchor="middle" class="lbl">worker → Redis → custom Prometheus collector</text>
<text x="865" y="740" font-size="11.5" text-anchor="middle" class="mut">a stalled checker is itself visible (age grows)</text>

<g filter="url(#sh)"><rect class="cardD" x="1110" y="642" width="280" height="150" rx="14"/></g>
<text x="1250" y="672" font-size="14.5" text-anchor="middle" class="tD">On violation</text>
<text x="1250" y="696" font-size="12" text-anchor="middle" class="lbl">names the 10 worst-affected</text>
<text x="1250" y="714" font-size="12" text-anchor="middle" class="lbl">students, not just a count</text>
<text x="1250" y="738" font-size="11.5" text-anchor="middle" class="mut">Aug 2026: caught &amp; repaid ~49k XP,</text>
<text x="1250" y="754" font-size="11.5" text-anchor="middle" class="mut">then held at zero ever since</text>

<path class="arrG" d="M 620 717 L 696 717" marker-end="url(#m)"/>
<path class="arrD" d="M 1030 717 L 1106 717" marker-end="url(#m)"/>

</svg>