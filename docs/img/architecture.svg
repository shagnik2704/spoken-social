<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890" font-family="Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3949ab"/><stop offset="1" stop-color="#0f766e"/>
  </linearGradient>
  <marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
  </marker>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.14"/>
  </filter>
</defs>
<style>
  .bg{fill:#f8fafc}.card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
  .cardA{fill:#eef2ff;stroke:#283593;stroke-width:2}
  .cardB{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}
  .cardC{fill:#fffbeb;stroke:#b45309;stroke-width:2}
  .cardD{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}
  .cardE{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:6 3}
  .cardG{fill:#f0fdf4;stroke:#15803d;stroke-width:2}
  .inner{fill:#ffffff;stroke:#c7d2fe;stroke-width:1.2}
  .band{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.5}
  .t1{fill:#0f172a;font-weight:700}.t2{fill:#334155;font-weight:600}
  .lbl{fill:#475569}.mut{fill:#64748b}
  .tA{fill:#283593;font-weight:700}.tB{fill:#0f766e;font-weight:700}
  .tC{fill:#92400e;font-weight:700}.tD{fill:#b91c1c;font-weight:700}
  .tE{fill:#6d28d9;font-weight:700}.tG{fill:#15803d;font-weight:700}
  .arr{stroke:#475569;stroke-width:2;fill:none}
  .arrA{stroke:#283593;stroke-width:2.2;fill:none}
  .arrB{stroke:#0f766e;stroke-width:2;fill:none}
  .arrD{stroke:#b91c1c;stroke-width:2;fill:none}
  .arrE{stroke:#6d28d9;stroke-width:2;stroke-dasharray:6 3;fill:none}
  .arrG{stroke:#15803d;stroke-width:2;fill:none}
  .pill{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
  .pilltext{fill:#475569;font-weight:600}
  .accent{fill:url(#brand)}
  .num{fill:#ffffff;font-weight:700}
  .numbg{fill:#283593}
  .gold{fill:#b45309;font-weight:700}
</style>
<rect class="bg" width="1440" height="890"/>

<rect class="accent" x="40" y="34" width="56" height="8" rx="4"/>
<text x="40" y="74" font-size="26" class="t1">Spoken Social — System Architecture</text>
<text x="40" y="98" font-size="13.5" class="mut">11 Docker Compose services on one cloud VM · every arrow is a real dependency</text>
<!-- client column -->
<g filter="url(#sh)"><rect class="cardA" x="50" y="140" width="300" height="118" rx="14"/></g>
<text x="200" y="170" font-size="16" text-anchor="middle" class="tA">React SPA</text>
<text x="200" y="192" font-size="12" text-anchor="middle" class="lbl">React 19 · TypeScript strict · Vite 7</text>
<text x="200" y="210" font-size="12" text-anchor="middle" class="lbl">Zustand (client) + TanStack Query (server)</text>
<text x="200" y="228" font-size="12" text-anchor="middle" class="lbl">optimistic XP updates → cache invalidation</text>

<g filter="url(#sh)"><rect class="cardB" x="50" y="298" width="300" height="84" rx="14"/></g>
<text x="200" y="328" font-size="15" text-anchor="middle" class="tB">nginx</text>
<text x="200" y="350" font-size="12" text-anchor="middle" class="lbl">static bundle · SPA fallback · reverse proxy</text>

<g filter="url(#sh)"><rect class="cardE" x="50" y="470" width="300" height="120" rx="14"/></g>
<text x="200" y="500" font-size="14" text-anchor="middle" class="tE">External services</text>
<text x="200" y="524" font-size="12" text-anchor="middle" class="lbl">Spoken Tutorial credential API</text>
<text x="200" y="542" font-size="12" text-anchor="middle" class="lbl">Spoken Tutorial Forums</text>
<text x="200" y="562" font-size="11.5" text-anchor="middle" class="mut">login verification · signed activity webhooks</text>

<!-- backend center -->
<g filter="url(#sh)"><rect class="cardA" x="470" y="140" width="420" height="260" rx="16"/></g>
<text x="680" y="172" font-size="17" text-anchor="middle" class="tA">FastAPI backend (async)</text>
<text x="680" y="192" font-size="12" text-anchor="middle" class="mut">36 REST endpoints · 10 routers · asyncpg pool</text>
<rect class="inner" x="492" y="208" width="180" height="52" rx="9"/>
<text x="582" y="229" font-size="11.5" text-anchor="middle" class="t2">JWT auth + RBAC</text>
<text x="582" y="247" font-size="11" text-anchor="middle" class="mut">audited impersonation</text>
<rect class="inner" x="688" y="208" width="180" height="52" rx="9"/>
<text x="778" y="229" font-size="11.5" text-anchor="middle" class="t2">XP engine</text>
<text x="778" y="247" font-size="11" text-anchor="middle" class="mut">single writer · idempotent</text>
<rect class="inner" x="492" y="272" width="180" height="52" rx="9"/>
<text x="582" y="293" font-size="11.5" text-anchor="middle" class="t2">Leaderboards</text>
<text x="582" y="311" font-size="11" text-anchor="middle" class="mut">RANK() · no cache · 0.11 ms</text>
<rect class="inner" x="688" y="272" width="180" height="52" rx="9"/>
<text x="778" y="293" font-size="11.5" text-anchor="middle" class="t2">Analytics</text>
<text x="778" y="311" font-size="11" text-anchor="middle" class="mut">SQL aggregation · XLSX export</text>
<rect class="inner" x="492" y="336" width="376" height="44" rx="9"/>
<text x="680" y="363" font-size="11.5" text-anchor="middle" class="t2">Forum webhook receiver (shared-secret verified)</text>

<!-- worker -->
<g filter="url(#sh)"><rect class="cardG" x="470" y="452" width="420" height="128" rx="14"/></g>
<text x="680" y="482" font-size="15" text-anchor="middle" class="tG">arq worker (cron)</text>
<text x="680" y="506" font-size="12" text-anchor="middle" class="lbl">forum-XP verification sweep — every 15 min, 24 h window</text>
<text x="680" y="524" font-size="12" text-anchor="middle" class="lbl">nightly XP integrity check — 7 SQL invariants, 02:00 IST</text>
<text x="680" y="546" font-size="11.5" text-anchor="middle" class="mut">publishes results to Redis → Prometheus gauges</text>

<!-- data column -->
<g filter="url(#sh)"><rect class="cardC" x="1010" y="140" width="380" height="112" rx="14"/></g>
<text x="1200" y="170" font-size="15" text-anchor="middle" class="tC">PostgreSQL 16</text>
<text x="1200" y="194" font-size="12" text-anchor="middle" class="lbl">27 tables · 30 indexes · 19 Alembic migrations</text>
<text x="1200" y="212" font-size="12" text-anchor="middle" class="lbl">append-only xp_events journal</text>
<text x="1200" y="230" font-size="11.5" text-anchor="middle" class="mut">covering indexes serve course-XP sums index-only</text>

<g filter="url(#sh)"><rect class="cardD" x="1010" y="292" width="380" height="108" rx="14"/></g>
<text x="1200" y="322" font-size="15" text-anchor="middle" class="tD">Redis 7 — three duties</text>
<text x="1200" y="346" font-size="12" text-anchor="middle" class="lbl">fail-open TTL cache (analytics, 120–300 s)</text>
<text x="1200" y="364" font-size="12" text-anchor="middle" class="lbl">arq job queue · integrity-result handoff</text>

<!-- observability band -->
<g filter="url(#sh)"><rect class="band" x="50" y="640" width="1340" height="220" rx="16"/></g>
<text x="720" y="672" font-size="15" text-anchor="middle" class="t1">Observability — cardinality-tuned by design</text>
<rect class="card" x="86" y="692" width="230" height="92" rx="11"/>
<text x="201" y="720" font-size="13" text-anchor="middle" class="tC">Prometheus</text>
<text x="201" y="740" font-size="11.5" text-anchor="middle" class="lbl">app metrics + xp_integrity_*</text>
<text x="201" y="757" font-size="11.5" text-anchor="middle" class="mut">custom collector · /metrics excluded</text>
<rect class="card" x="342" y="692" width="230" height="92" rx="11"/>
<text x="457" y="720" font-size="13" text-anchor="middle" class="tB">Grafana Alloy</text>
<text x="457" y="740" font-size="11.5" text-anchor="middle" class="lbl">container stdout → Loki</text>
<text x="457" y="757" font-size="11.5" text-anchor="middle" class="mut">replaced promtail</text>
<rect class="card" x="598" y="692" width="230" height="92" rx="11"/>
<text x="713" y="720" font-size="13" text-anchor="middle" class="tG">Loki</text>
<text x="713" y="740" font-size="11.5" text-anchor="middle" class="lbl">log aggregation · LogQL</text>
<rect class="card" x="854" y="692" width="230" height="92" rx="11"/>
<text x="969" y="720" font-size="13" text-anchor="middle" class="t2">Exporters</text>
<text x="969" y="740" font-size="11.5" text-anchor="middle" class="lbl">node-exporter · cAdvisor</text>
<text x="969" y="757" font-size="11.5" text-anchor="middle" class="mut">~99% of default ingest cut</text>
<rect class="cardA" x="1110" y="692" width="240" height="92" rx="11"/>
<text x="1230" y="720" font-size="13" text-anchor="middle" class="tA">MCP server</text>
<text x="1230" y="740" font-size="11.5" text-anchor="middle" class="lbl">12 read-only tools</text>
<text x="1230" y="757" font-size="11.5" text-anchor="middle" class="mut">SQL · PromQL · LogQL · audited</text>
<text x="720" y="822" font-size="11.5" text-anchor="middle" class="mut">MCP queries Prometheus, Loki and a SELECT-only Postgres role — natural-language ops queries via AI clients; tool calls log arguments, never results</text>

