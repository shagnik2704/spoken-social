<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1240" height="860" fill="#ffffff"/>
  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Spoken Social — System Architecture</text>

  <!-- Client tier -->
  <rect x="40" y="70" width="300" height="110" rx="10" fill="#eef2ff" stroke="#283593" stroke-width="2"/>
  <text x="190" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#283593">React SPA (Vite + TS)</text>
  <text x="190" y="124" text-anchor="middle" font-size="12" fill="#374151">Zustand (client state)</text>
  <text x="190" y="142" text-anchor="middle" font-size="12" fill="#374151">TanStack Query (server state)</text>
  <text x="190" y="160" text-anchor="middle" font-size="12" fill="#374151">Recharts dashboards</text>

  <!-- nginx -->
  <rect x="40" y="230" width="300" height="70" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="190" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f766e">nginx</text>
  <text x="190" y="280" text-anchor="middle" font-size="12" fill="#374151">static assets + SPA fallback + reverse proxy</text>

  <!-- Backend -->
  <rect x="440" y="90" width="360" height="240" rx="10" fill="#eef2ff" stroke="#283593" stroke-width="2.5"/>
  <text x="620" y="120" text-anchor="middle" font-size="17" font-weight="bold" fill="#283593">FastAPI Backend (async)</text>
  <text x="620" y="146" text-anchor="middle" font-size="12" fill="#374151">36 REST endpoints / 10 routers</text>
  <rect x="460" y="160" width="150" height="44" rx="6" fill="#ffffff" stroke="#6366f1"/>
  <text x="535" y="178" text-anchor="middle" font-size="11" fill="#374151">JWT auth + RBAC</text>
  <text x="535" y="194" text-anchor="middle" font-size="11" fill="#374151">impersonation audit</text>
  <rect x="630" y="160" width="150" height="44" rx="6" fill="#ffffff" stroke="#6366f1"/>
  <text x="705" y="178" text-anchor="middle" font-size="11" fill="#374151">XP engine</text>
  <text x="705" y="194" text-anchor="middle" font-size="11" fill="#374151">single-writer, idempotent</text>
  <rect x="460" y="216" width="150" height="44" rx="6" fill="#ffffff" stroke="#6366f1"/>
  <text x="535" y="234" text-anchor="middle" font-size="11" fill="#374151">Leaderboards</text>
  <text x="535" y="250" text-anchor="middle" font-size="11" fill="#374151">SQL window functions</text>
  <rect x="630" y="216" width="150" height="44" rx="6" fill="#ffffff" stroke="#6366f1"/>
  <text x="705" y="234" text-anchor="middle" font-size="11" fill="#374151">Dashboards</text>
  <text x="705" y="250" text-anchor="middle" font-size="11" fill="#374151">SQL aggregation + XLSX</text>
  <rect x="460" y="272" width="320" height="40" rx="6" fill="#ffffff" stroke="#6366f1"/>
  <text x="620" y="297" text-anchor="middle" font-size="11" fill="#374151">Forum webhook receiver (shared-secret verified)</text>

  <!-- Postgres -->
  <rect x="900" y="90" width="290" height="100" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="1045" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#a16207">PostgreSQL 16</text>
  <text x="1045" y="144" text-anchor="middle" font-size="12" fill="#374151">27 tables · 30 indexes</text>
  <text x="1045" y="162" text-anchor="middle" font-size="12" fill="#374151">XP event journal · Alembic migrations</text>

  <!-- Redis -->
  <rect x="900" y="220" width="290" height="90" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="1045" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">Redis 7</text>
  <text x="1045" y="270" text-anchor="middle" font-size="12" fill="#374151">TTL cache (analytics) · arq job queue</text>
  <text x="1045" y="288" text-anchor="middle" font-size="12" fill="#374151">integrity-result handoff</text>

  <!-- Worker -->
  <rect x="440" y="380" width="360" height="110" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="620" y="408" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">arq Worker (cron)</text>
  <text x="620" y="432" text-anchor="middle" font-size="12" fill="#374151">forum-XP verification sweep (every 15 min, 24 h window)</text>
  <text x="620" y="452" text-anchor="middle" font-size="12" fill="#374151">nightly XP integrity check — 7 SQL invariants</text>
  <text x="620" y="472" text-anchor="middle" font-size="12" fill="#374151">publishes results to Redis for Prometheus</text>

  <!-- External -->
  <rect x="40" y="380" width="300" height="110" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="190" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">External Services</text>
  <text x="190" y="432" text-anchor="middle" font-size="12" fill="#374151">Spoken Tutorial credential API</text>
  <text x="190" y="452" text-anchor="middle" font-size="12" fill="#374151">Spoken Tutorial Forums</text>
  <text x="190" y="472" text-anchor="middle" font-size="12" fill="#374151">(login verify · activity webhooks)</text>

  <!-- Observability box -->
  <rect x="40" y="560" width="1150 " height="250" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="620" y="590" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Observability Stack (Docker Compose)</text>

  <rect x="80" y="620" width="200" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="180" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#ea580c">Prometheus</text>
  <text x="180" y="672" text-anchor="middle" font-size="11" fill="#374151">metrics + XP invariant</text>
  <text x="180" y="688" text-anchor="middle" font-size="11" fill="#374151">gauges (custom collector)</text>

  <rect x="320" y="620" width="200" height="80" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="2"/>
  <text x="420" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#ca8a04">Grafana Alloy</text>
  <text x="420" y="672" text-anchor="middle" font-size="11" fill="#374151">container log shipping</text>
  <text x="420" y="688" text-anchor="middle" font-size="11" fill="#374151">(Docker stdout → Loki)</text>

  <rect x="560" y="620" width="200" height="80" rx="8" fill="#ffffff" stroke="#65a30d" stroke-width="2"/>
  <text x="660" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#65a30d">Loki</text>
  <text x="660" y="672" text-anchor="middle" font-size="11" fill="#374151">log aggregation</text>
  <text x="660" y="688" text-anchor="middle" font-size="11" fill="#374151">LogQL queries</text>

  <rect x="800" y="620" width="180" height="80" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="890" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Exporters</text>
  <text x="890" y="672" text-anchor="middle" font-size="11" fill="#374151">node-exporter · cAdvisor</text>
  <text x="890" y="688" text-anchor="middle" font-size="11" fill="#374151">(cardinality-tuned)</text>

  <rect x="1010" y="620" width="160" height="80" rx="8" fill="#eef2ff" stroke="#283593" stroke-width="2"/>
  <text x="1090" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#283593">MCP Server</text>
  <text x="1090" y="672" text-anchor="middle" font-size="11" fill="#374151">12 read-only tools</text>
  <text x="1090" y="688" text-anchor="middle" font-size="11" fill="#374151">SQL · PromQL · LogQL</text>

  <text x="620" y="740" text-anchor="middle" font-size="12" fill="#64748b">MCP server queries Prometheus, Loki and a read-only Postgres role — natural-language operations queries via AI clients</text>
  <text x="620" y="762" text-anchor="middle" font-size="12" fill="#64748b">Every MCP tool call is audit-logged (arguments only, never results) and shipped to Loki, searchable through the server itself</text>

  <!-- Arrows -->
  <line x1="190" y1="180" x2="190" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="265" x2="440" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="230" font-size="11" fill="#64748b">REST /api</text>
  <line x1="800" y1="150" x2="900" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="132" font-size="11" fill="#64748b">asyncpg</text>
  <line x1="800" y1="260" x2="900" y2="262" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="826" y="252" font-size="11" fill="#64748b">cache-aside</text>
  <line x1="340" y1="420" x2="440" y2="300" stroke="#6d28d9" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="350" y="352" font-size="11" fill="#6d28d9">webhooks</text>
  <line x1="340" y1="435" x2="440" y2="180" stroke="#6d28d9" stroke-width="2" stroke-dasharray="5 3" marker-start="url(#arrow)"/>
  <text x="340" y="316" font-size="11" fill="#6d28d9">verify login</text>
  <line x1="700" y1="380" x2="920" y2="310" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="400" x2="960" y2="190" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="490" x2="620" y2="560" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="180" y1="620" x2="500" y2="330" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="256" y="530" font-size="11" fill="#ea580c">scrape /metrics</text>
</svg>
