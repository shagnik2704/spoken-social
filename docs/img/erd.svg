<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="960" viewBox="0 0 1300 960" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1300" height="960" fill="#ffffff"/>
  <text x="650" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">Spoken Social — Entity-Relationship Overview (core tables)</text>
  <text x="650" y="56" text-anchor="middle" font-size="12" fill="#64748b">Arrows point from foreign key to referenced table · 27 tables total, social-feed schema grouped</text>

  <!-- helper styles: content boxes -->
  <!-- Column A: content hierarchy -->
  <g>
    <rect x="45" y="90" width="205" height="64" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
    <text x="147" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">programmes</text>
    <text x="147" y="132" text-anchor="middle" font-size="10.5" fill="#475569">id PK · name</text>

    <rect x="45" y="230" width="205" height="72" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
    <text x="147" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">courses</text>
    <text x="147" y="272" text-anchor="middle" font-size="10.5" fill="#475569">id PK · name</text>
    <text x="147" y="287" text-anchor="middle" font-size="10.5" fill="#475569">total_tutorials</text>

    <rect x="45" y="380" width="205" height="72" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
    <text x="147" y="402" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">batches</text>
    <text x="147" y="422" text-anchor="middle" font-size="10.5" fill="#475569">id PK · course_id FK</text>
    <text x="147" y="437" text-anchor="middle" font-size="10.5" fill="#475569">start/end date · status</text>

    <rect x="45" y="520" width="205" height="72" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
    <text x="147" y="542" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">tutorials</text>
    <text x="147" y="562" text-anchor="middle" font-size="10.5" fill="#475569">id PK · course_id FK</text>
    <text x="147" y="577" text-anchor="middle" font-size="10.5" fill="#475569">title · order</text>
  </g>

  <!-- Junctions -->
  <g>
    <rect x="330" y="150" width="190" height="58" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="425" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">programme_courses</text>
    <text x="425" y="190" text-anchor="middle" font-size="10" fill="#64748b">programme_id · course_id</text>

    <rect x="330" y="300" width="190" height="66" rx="7" fill="#eef2ff" stroke="#283593" stroke-width="1.8"/>
    <text x="425" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#283593">user_courses</text>
    <text x="425" y="340" text-anchor="middle" font-size="10" fill="#475569">user_id · course_id · batch_id</text>
    <text x="425" y="355" text-anchor="middle" font-size="10" fill="#475569">(enrolment)</text>

    <rect x="330" y="470" width="190" height="86" rx="7" fill="#eef2ff" stroke="#283593" stroke-width="2.2"/>
    <text x="425" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#283593">user_tutorials</text>
    <text x="425" y="510" text-anchor="middle" font-size="10" fill="#475569">user_id · tutorial_id</text>
    <text x="425" y="525" text-anchor="middle" font-size="10" fill="#475569">watched · practiced · assignment</text>
    <text x="425" y="540" text-anchor="middle" font-size="10" fill="#475569">xp_earned (derived from flags)</text>
  </g>

  <!-- Users center -->
  <rect x="590" y="300" width="230" height="120" rx="9" fill="#fefce8" stroke="#a16207" stroke-width="2.4"/>
  <text x="705" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#854d0e">users</text>
  <text x="705" y="348" text-anchor="middle" font-size="10.5" fill="#475569">id PK · email · role</text>
  <text x="705" y="364" text-anchor="middle" font-size="10.5" fill="#475569">xp_total · level · college_id FK</text>
  <text x="705" y="380" text-anchor="middle" font-size="10.5" fill="#475569">is_test_account NOT NULL</text>
  <text x="705" y="396" text-anchor="middle" font-size="10.5" fill="#475569">(student / coordinator / admin)</text>

