  <g>
    <rect x="1010" y="90" width="240" height="80" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
    <text x="1130" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#115e59">colleges</text>
    <text x="1130" y="132" text-anchor="middle" font-size="10.5" fill="#475569">id PK · name · location</text>
    <text x="1130" y="147" text-anchor="middle" font-size="10.5" fill="#475569">coordinator linkage</text>

    <rect x="1010" y="210" width="240" height="86" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
    <text x="1130" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">xp_events</text>
    <text x="1130" y="252" text-anchor="middle" font-size="10.5" fill="#475569">user_id FK · xp_delta · course_id</text>
    <text x="1130" y="267" text-anchor="middle" font-size="10.5" fill="#475569">source_type · created_at (indexed)</text>
    <text x="1130" y="282" text-anchor="middle" font-size="10.5" fill="#475569">append-only journal</text>

    <rect x="1010" y="336" width="240" height="80" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
    <text x="1130" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">forum_activities</text>
    <text x="1130" y="378" text-anchor="middle" font-size="10.5" fill="#475569">user_id · tutorial_id · type</text>
    <text x="1130" y="393" text-anchor="middle" font-size="10.5" fill="#475569">posted_at · deleted · xp_awarded</text>

